name: Agent CI

on:
  push:
    branches: [v4.0]
  pull_request:
    branches: [v4.0]
  workflow_dispatch:

jobs:
  backend-smoke:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ci
      LLM_MODEL: ci-model
      LLM_BASE_URL: http://127.0.0.1:11434/v1
      RESIN_DB_HOST: 127.0.0.1
      RESIN_DB_USER: ci
      RESIN_DB_PASSWORD: ci
      RESIN_DB_NAME: ci
      RESIN_TABLE_STATIC: material_static
      RESIN_TABLE_MATERIAL_THERMAL_PROPERTY: material_thermal_property
      RESIN_TABLE_THERMAL_RESPONSE: thermal_response
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app eval tests tools
      - run: python -m unittest tests.test_approval_workflow tests.test_api_workbench tests.test_api_approval_e2e tests.test_evaluation_harness -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
